name: 'Test Reusable Action & Scripts'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: 'Unit Tests (Matrix & Deprecation Discovery)'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v

  test-discovery-dry-run:
    name: 'Discovery Dry Run'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test dynamic runner matrix discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/discover_matrix.py --output-json

  test-reusable-action-e2e:
    name: 'E2E Test: Install & Validate (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Python + OpenSSL via Reusable Action (default summary display)
        id: install-python
        uses: ./
        with:
          version: 'latest'

      - name: Verify Reusable Action Outputs including build-summary
        shell: bash
        run: |
          echo "Python Path: ${{ steps.install-python.outputs.python-path }}"
          echo "Python Version: ${{ steps.install-python.outputs.python-version }}"
          echo "OpenSSL Path: ${{ steps.install-python.outputs.openssl-path }}"
          echo "OpenSSL Version: ${{ steps.install-python.outputs.openssl-version }}"
          if [ -z "${{ steps.install-python.outputs.build-summary }}" ]; then
            echo "Error: build-summary output is missing or empty"
            exit 1
          fi
          echo "Successfully verified build-summary output presence."

      - name: Test Reusable Action in quiet mode
        uses: ./
        with:
          version: 'latest'
          quiet: 'true'

      - name: Run GAM / GYB Validation Suite
        shell: bash
        run: |
          "$PYTHON" scripts/validate_runtime.py
