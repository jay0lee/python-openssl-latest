name: 'Test Reusable Action & Scripts'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: 'Unit Tests (Matrix & Deprecation Discovery)'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v

  test-discovery-dry-run:
    name: 'Discovery Dry Run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test dynamic runner matrix discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/discover_matrix.py --output-json

  test-reusable-action-e2e:
    name: 'E2E Test: Install & Validate (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7

      - name: Install Python + OpenSSL via Reusable Action
        uses: ./
        with:
          version: 'latest'

      - name: Run GAM / GYB Validation Suite
        shell: bash
        run: |
          "$PYTHON" scripts/validate_runtime.py
